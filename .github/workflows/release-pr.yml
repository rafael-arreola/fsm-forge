name: "Release: Create Pull Request"

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Tipo de incremento de versión (SemVer)"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: "Versión SemVer personalizada (opcional, ej. 0.2.0). Para publicar la versión actual de main sin cambios usa el workflow 'Release: Create Git Tag & Publish'."
        required: false
        type: string

jobs:
  create-pr:
    name: Bump Version & Create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bump Version in Cargo.toml & CHANGELOG.md
        id: bump_version
        env:
          BUMP: ${{ inputs.version_bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import re
          import sys
          import tomllib

          SEMVER = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          bump = os.environ["BUMP"]
          custom = os.environ.get("CUSTOM_VERSION", "").strip()
          if custom and not SEMVER.match(custom):
              fail(f"custom_version '{custom}' no es una versión SemVer válida (ej. 1.2.3)")

          with open("Cargo.toml", "rb") as f:
              current = tomllib.load(f)["package"]["version"]

          if custom:
              if custom == current:
                  fail(
                      f"Cargo.toml ya tiene la versión {current}. "
                      "Ejecuta 'Release: Create Git Tag & Publish' para publicarla directamente."
                  )
              new = custom
          else:
              parts = re.match(r"^(\d+)\.(\d+)\.(\d+)$", current)
              if not parts:
                  fail(f"La versión actual '{current}' tiene sufijo pre-release; indica custom_version explícitamente")
              major, minor, patch = map(int, parts.groups())
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              new = f"{major}.{minor}.{patch}"

          with open("Cargo.toml") as f:
              lines = f.readlines()

          in_package = False
          replaced = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  in_package = stripped == "[package]"
                  continue
              if in_package and re.match(r'^version\s*=\s*"[^"]+"', stripped):
                  lines[i] = f'version = "{new}"\n'
                  replaced = True
                  break

          if not replaced:
              fail("No se pudo actualizar version en [package] de Cargo.toml")

          with open("Cargo.toml", "w") as f:
              f.writelines(lines)

          heading = "## [Unreleased]"
          with open("CHANGELOG.md") as f:
              changelog = f.read()
          if heading not in changelog:
              fail("CHANGELOG.md no tiene la sección '## [Unreleased]'")
          if f"## [{new}]" in changelog:
              fail(f"CHANGELOG.md ya tiene una sección para la versión {new}")

          rest = changelog[changelog.index(heading) + len(heading):]
          following = rest.find("\n## [")
          notes = rest if following == -1 else rest[:following]
          if not notes.strip():
              print(f"::warning::[Unreleased] está vacía: la versión {new} no tendrá notas en el CHANGELOG")
          today = datetime.date.today().isoformat()
          changelog = changelog.replace(heading, f"{heading}\n\n## [{new}] - {today}", 1)
          with open("CHANGELOG.md", "w") as f:
              f.write(changelog)

          print(f"Versión: {current} -> {new}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"NEW_VERSION={new}\n")
          PY

      - name: Validate Format, Tests, Clippy, Docs & Package
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo check
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo doc --locked --no-deps
          cargo package --locked --allow-dirty

      - name: Commit and Push Release Branch
        id: git_push
        env:
          NEW_VER: ${{ steps.bump_version.outputs.NEW_VERSION }}
        run: |
          BRANCH_NAME="release/v${NEW_VER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add Cargo.toml Cargo.lock CHANGELOG.md

          if git diff --quiet --staged; then
            echo "::error::No hay cambios para la versión ${NEW_VER}."
            exit 1
          fi

          git commit -m "chore(release): bump version to v${NEW_VER}"
          git push origin "$BRANCH_NAME" --force
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.bump_version.outputs.NEW_VERSION }}
          BRANCH_NAME: ${{ steps.git_push.outputs.BRANCH_NAME }}
        run: |
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Ya existe un Pull Request abierto (#$EXISTING_PR) para la rama $BRANCH_NAME"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "### Release v${NEW_VER}" \
            "" \
            "Pull Request creado de forma automatizada por el pipeline de release." \
            "" \
            "Al hacer merge en \`main\` se crea la etiqueta \`v${NEW_VER}\`, se publica \`fsm-forge ${NEW_VER}\` en crates.io y se crea el Release en GitHub." \
            "" \
            "Revisa la sección \`[${NEW_VER}]\` del CHANGELOG antes del merge: es el texto del Release.")

          gh pr create \
            --title "chore(release): bump version to v${NEW_VER}" \
            --body "$BODY" \
            --head "$BRANCH_NAME" \
            --base main
