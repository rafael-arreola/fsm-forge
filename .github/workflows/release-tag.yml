name: "Release: Create Git Tag & Publish"

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-tag:
    name: Generate Tag & Publish Crate
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    environment: deployment-crates
    permissions:
      contents: write # Crear y subir etiquetas y releases en GitHub
      id-token: write # Trusted Publishing: pedir a crates.io un token temporal (OIDC)

    steps:
      - name: Manual Git Checkout
        run: |
          # Clonar manualmente el repositorio y posicionarse en main
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout main

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify If Commit Is A Release
        id: check_release
        run: |
          # Obtener el mensaje del último commit integrado en main
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "=== ULTIMO COMMIT DETECTADO EN MAIN ==="
          echo "$COMMIT_MSG"
          echo "========================================"

          # Buscar firmas de release/v (merge commits normales) o chore(release): (squash merges)
          if echo "$COMMIT_MSG" | grep -qE "chore\(release\):|release/v"; then
            echo "Firma de release encontrada. Procediendo con el etiquetado y publicación."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Firma de release NO encontrada. Cancelando etiquetado."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Version from Cargo.toml
        if: steps.check_release.outputs.is_release == 'true'
        id: get_version
        run: |
          VERSION=$(python3 -c '
          import re
          with open("Cargo.toml", "r") as f:
              content = f.read()
          match = re.search(r"\[package\].*?version\s*=\s*\"([^\"]+)\"", content, re.DOTALL)
          if match:
              print(match.group(1))
          ')
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo leer la versión de Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Tests Before Publishing
        if: steps.check_release.outputs.is_release == 'true'
        # Última barrera: el PR de release no pasa por el CI, y main pudo cambiar después
        # de crearlo. Si algo falla aquí no se crea la etiqueta ni se publica nada.
        run: cargo test --locked

      - name: Authenticate with crates.io (Trusted Publishing)
        if: steps.check_release.outputs.is_release == 'true'
        id: crates_auth
        # Falla mientras Trusted Publishing no esté configurado para este repositorio en
        # crates.io (por ejemplo, antes de la primera publicación del crate). En ese caso
        # el siguiente paso publica con el secret CRATES_IO_TOKEN.
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.check_release.outputs.is_release == 'true'
        env:
          TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates_auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$TRUSTED_PUBLISHING_TOKEN" ]; then
            echo "Publicando con Trusted Publishing (token temporal de crates.io)."
            export CARGO_REGISTRY_TOKEN="$TRUSTED_PUBLISHING_TOKEN"
          elif [ -n "$FALLBACK_TOKEN" ]; then
            echo "::warning::Trusted Publishing no está disponible; publicando con el secret CRATES_IO_TOKEN."
            export CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN"
          else
            echo "::error::Sin credenciales: configura Trusted Publishing en crates.io o el secret CRATES_IO_TOKEN en el environment deployment-crates."
            exit 1
          fi
          # Se publica antes de crear el tag: si crates.io rechaza el paquete o falta el
          # token, no queda una etiqueta huérfana en el repositorio.
          cargo publish --locked

      - name: Create and Push Git Tag
        if: steps.check_release.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          TAG_NAME="v${VERSION}"

          git fetch --tags

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "La etiqueta $TAG_NAME ya existe en el repositorio. Omitiendo la creación."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "$TAG_NAME" -m "Release version ${TAG_NAME}"
            git push origin "$TAG_NAME"
            echo "Etiqueta $TAG_NAME creada y empujada de forma exitosa."
          fi

      - name: Extract Release Notes from CHANGELOG.md
        if: steps.check_release.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import os

          version = os.environ["VERSION"]
          with open("CHANGELOG.md") as f:
              changelog = f.read()

          heading = f"## [{version}]"
          notes = ""
          if heading in changelog:
              section = changelog[changelog.index(heading):]
              body = section.split("\n", 1)[1] if "\n" in section else ""
              following = body.find("\n## [")
              notes = (body if following == -1 else body[:following]).strip()

          if not notes:
              print(f"::warning::CHANGELOG.md no tiene notas para {version}")
              notes = f"Release {version}."

          with open("release-notes.md", "w") as f:
              f.write(notes + "\n")
          PY

      - name: Create GitHub Release
        if: steps.check_release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
