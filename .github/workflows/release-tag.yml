name: "Release: Create Git Tag & Publish"

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

jobs:
  create-tag:
    name: Generate Tag & Publish Crate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    environment: deployment-crates
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout Target Commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$MERGE_SHA" ]; then
              echo "::error::No se encontró merge_commit_sha en el Pull Request."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
              echo "::error::El commit $MERGE_SHA no pertenece al historial de main."
              exit 1
            fi
            git checkout "$MERGE_SHA"
          else
            git checkout origin/main
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract & Validate Version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo leer la versión de Cargo.toml"
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" != "release/v${VERSION}" ]; then
            echo "::error::La rama del PR ($HEAD_REF) no coincide con Cargo.toml (v${VERSION})."
            exit 1
          fi

          TAG_NAME="v${VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)
          if EXISTING_SHA=$(git rev-parse -q --verify "refs/tags/${TAG_NAME}^{commit}"); then
            if [ "$EXISTING_SHA" != "$HEAD_SHA" ]; then
              echo "::error::La etiqueta ${TAG_NAME} ya existe en otro commit (${EXISTING_SHA})."
              exit 1
            fi
            echo "ALREADY_TAGGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "ALREADY_TAGGED=false" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Tests Before Publishing
        if: steps.get_version.outputs.ALREADY_TAGGED == 'false'
        run: cargo test --locked

      - name: Authenticate with crates.io (Trusted Publishing)
        if: steps.get_version.outputs.ALREADY_TAGGED == 'false'
        id: crates_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.get_version.outputs.ALREADY_TAGGED == 'false'
        env:
          TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates_auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$TRUSTED_PUBLISHING_TOKEN" ]; then
            export CARGO_REGISTRY_TOKEN="$TRUSTED_PUBLISHING_TOKEN"
          elif [ -n "$FALLBACK_TOKEN" ]; then
            echo "::warning::Trusted Publishing no está disponible; publicando con CRATES_IO_TOKEN."
            export CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN"
          else
            echo "::error::Sin credenciales: configura Trusted Publishing en crates.io o CRATES_IO_TOKEN en deployment-crates."
            exit 1
          fi
          cargo publish --locked

      - name: Create and Push Git Tag
        if: steps.get_version.outputs.ALREADY_TAGGED == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          TAG_NAME="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release version ${TAG_NAME}"
          git push origin "$TAG_NAME"

      - name: Extract Release Notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import os

          version = os.environ["VERSION"]
          with open("CHANGELOG.md") as f:
              changelog = f.read()

          heading = f"## [{version}]"
          notes = ""
          if heading in changelog:
              section = changelog[changelog.index(heading):]
              body = section.split("\n", 1)[1] if "\n" in section else ""
              following = body.find("\n## [")
              notes = (body if following == -1 else body[:following]).strip()

          if not notes:
              print(f"::warning::CHANGELOG.md no tiene notas para {version}")
              notes = f"Release {version}."

          with open("release-notes.md", "w") as f:
              f.write(notes + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
