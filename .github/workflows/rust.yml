name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite & Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run unit, integration, and doc tests
        run: cargo test --locked --verbose
      - name: Run runnable examples
        run: |
          for example in 01_minimal 02_phases 03_counter 04_scopes 05_diagnostics 06_from_any 07_topology 08_ticket; do
            cargo run --locked --quiet --example "$example" >/dev/null
          done
      - name: Verify crate packaging
        run: cargo package --locked

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90
      - name: Run tests on MSRV
        run: cargo test --locked --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps
